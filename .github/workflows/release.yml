name: Release

# Push a tag like v1.0.0 to build the DMG and attach it to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - { arch: x64, rid: win-x64 }
          - { arch: ARM64, rid: win-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish windows/src/CleanMyMac.App/CleanMyMac.App.csproj -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.arch }} -p:Version=$version -o windows/artifacts/${{ matrix.rid }}
          Compress-Archive -Path "windows/artifacts/${{ matrix.rid }}/*" -DestinationPath "CleanMyMac-$version-windows-${{ matrix.arch }}.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: CleanMyMac-*-windows-*.zip

  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i '' "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"$VERSION\"/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: \".*\"/CURRENT_PROJECT_VERSION: \"$GITHUB_RUN_NUMBER\"/" project.yml
      - name: Build
        run: scripts/build.sh
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.dmg
          generate_release_notes: true
