name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: DiskKit tests (Linux) + translations
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test --package-path Packages/DiskKit
      - name: Check translations
        run: |
          apt-get update -qq && apt-get install -y -qq python3 >/dev/null
          python3 scripts/check_localization.py

  macos:
    name: Build macOS app + DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build (tests + universal app + DMG)
        run: scripts/build.sh
      - name: Smoke test (launch, scan, screenshots)
        run: |
          mkdir -p screenshots
          APP="build/Clean My Mac.app"
          BIN="$APP/Contents/MacOS/CleanMyMac"
          # 1) First launch: welcome screen.
          "$BIN" -AppleLanguages "(vi)" &
          sleep 8
          screencapture -x screenshots/1-onboarding.png || true
          pgrep -x CleanMyMac >/dev/null || { echo "App crashed on launch"; exit 1; }
          pkill -x CleanMyMac; sleep 2
          # 2) Skip onboarding and scan on launch.
          defaults write com.datnthutech.cleanmymac hasCompletedOnboarding -bool true
          "$BIN" -AppleLanguages "(vi)" -scanOnLaunch YES &
          sleep 10
          screencapture -x screenshots/2-scanning.png || true
          for i in $(seq 1 24); do sleep 10; pgrep -x CleanMyMac >/dev/null || { echo "App crashed while scanning"; exit 1; }; done
          screencapture -x screenshots/3-summary.png || true
          pkill -x CleanMyMac || true
          # Small JPEG preview in the log, for environments that cannot download artifacts.
          if [ -f screenshots/3-summary.png ]; then
            sips -s format jpeg -s formatOptions 45 -Z 1100 screenshots/3-summary.png --out /tmp/preview.jpg >/dev/null
            echo "PREVIEW-BEGIN"; base64 -i /tmp/preview.jpg | fold -w 8000; echo "PREVIEW-END"
          fi
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: CleanMyMac-dmg
          path: build/*.dmg
          if-no-files-found: error
