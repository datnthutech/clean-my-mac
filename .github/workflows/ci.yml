name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: DiskKit tests (Linux) + translations
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test --package-path Packages/DiskKit
      - name: Check translations
        run: |
          apt-get update -qq && apt-get install -y -qq python3 >/dev/null
          python3 scripts/check_localization.py

  macos:
    name: Build macOS app + DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build (tests + universal app + DMG)
        run: scripts/build.sh
      - name: Smoke test (launch, scan, screenshots)
        run: |
          mkdir -p screenshots
          APP="build/Clean My Mac.app"
          BIN="$APP/Contents/MacOS/CleanMyMac"
          # 1) First launch: welcome screen.
          "$BIN" -AppleLanguages "(vi)" &
          sleep 8
          screencapture -x screenshots/1-onboarding.png || true
          pgrep -x CleanMyMac >/dev/null || { echo "App crashed on launch"; exit 1; }
          pkill -x CleanMyMac; sleep 2
          # 2) Skip onboarding and scan on launch.
          defaults write com.datnthutech.cleanmymac hasCompletedOnboarding -bool true
          "$BIN" -AppleLanguages "(vi)" -scanOnLaunch YES &
          sleep 10
          screencapture -x screenshots/2-scanning.png || true
          for i in $(seq 1 24); do sleep 10; pgrep -x CleanMyMac >/dev/null || { echo "App crashed while scanning"; exit 1; }; done
          screencapture -x screenshots/3-summary.png || true
          pkill -x CleanMyMac || true; sleep 2
          # 3) Duplicate Names page at the default (smallest) window size — layout must not overflow.
          "$BIN" -AppleLanguages "(vi)" -scanOnLaunch YES -openPage duplicates &
          for i in $(seq 1 15); do sleep 10; pgrep -x CleanMyMac >/dev/null || { echo "App crashed on duplicates page"; exit 1; }; done
          screencapture -x screenshots/4-duplicates.png || true
          pkill -x CleanMyMac || true
          # 4) Every page before any scan (empty / not-ready states): the menu must always be visible.
          for page in summary drive duplicates docker log help settings; do
            "$BIN" -AppleLanguages "(vi)" -openPage "$page" &
            sleep 6
            pgrep -x CleanMyMac >/dev/null || { echo "App crashed on page $page"; exit 1; }
            screencapture -x "screenshots/page-$page.png" || true
            pkill -x CleanMyMac || true; sleep 2
          done
          # Contact sheet of all pages, printed as a small JPEG for environments that cannot download artifacts.
          python3 -m pip install --quiet --user --break-system-packages pillow >/dev/null 2>&1 || true
          python3 - <<'PY' || true
          import glob
          from PIL import Image
          files = ["screenshots/4-duplicates.png"] + sorted(glob.glob("screenshots/page-*.png"))
          tiles = [Image.open(f).convert("RGB") for f in files]
          w = 520; h = int(tiles[0].height * w / tiles[0].width)
          sheet = Image.new("RGB", (w * 3, h * ((len(tiles) + 2) // 3)), "white")
          for i, t in enumerate(tiles):
              sheet.paste(t.resize((w, h)), ((i % 3) * w, (i // 3) * h))
          sheet.save("/tmp/preview.jpg", quality=45)
          PY
          if [ -f /tmp/preview.jpg ]; then
            echo "PREVIEW-BEGIN"; base64 -i /tmp/preview.jpg | fold -w 8000; echo "PREVIEW-END"
          fi
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: CleanMyMac-dmg
          path: build/*.dmg
          if-no-files-found: error

  windows:
    name: Windows app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, rid: win-x64, runner: windows-latest, smoke: true }
          - { arch: ARM64, rid: win-arm64, runner: windows-latest, smoke: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Check translations
        shell: bash
        run: python scripts/check_localization.py
      - name: Core unit tests
        if: matrix.arch == 'x64'
        run: dotnet test windows/tests/DiskKit.Core.Tests -c Release
      - name: Publish (self-contained, Windows 10 1809+)
        run: >
          dotnet publish windows/src/CleanMyMac.App/CleanMyMac.App.csproj -c Release
          -r ${{ matrix.rid }} -p:Platform=${{ matrix.arch }}
          -o windows/artifacts/${{ matrix.rid }}
      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path "windows/artifacts/${{ matrix.rid }}/*" -DestinationPath "windows/artifacts/CleanMyMac-windows-${{ matrix.arch }}.zip"
      - name: Smoke test (launch every page, scan, screenshots)
        if: matrix.smoke
        shell: pwsh
        run: scripts/windows-smoke.ps1 -Exe "$PWD/windows/artifacts/${{ matrix.rid }}/CleanMyMac.exe" -Out screenshots
      - name: Contact sheet preview in log
        if: matrix.smoke && always()
        shell: bash
        run: |
          python -m pip install --quiet pillow || true
          python - <<'PY' || true
          import glob, base64
          from PIL import Image
          files = sorted(glob.glob("screenshots/page-*.png"))
          if files:
              tiles = [Image.open(f).convert("RGB") for f in files]
              w = 520; h = int(tiles[0].height * w / tiles[0].width)
              sheet = Image.new("RGB", (w * 3, h * ((len(tiles) + 2) // 3)), "white")
              for i, t in enumerate(tiles): sheet.paste(t.resize((w, h)), ((i % 3) * w, (i // 3) * h))
              sheet.save("preview.jpg", quality=45)
              print("PREVIEW-BEGIN"); data = base64.b64encode(open("preview.jpg", "rb").read()).decode()
              print("\n".join(data[i:i+8000] for i in range(0, len(data), 8000))); print("PREVIEW-END")
          PY
      - name: Upload screenshots
        if: matrix.smoke && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          path: screenshots/
          if-no-files-found: ignore
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CleanMyMac-windows-${{ matrix.arch }}
          path: windows/artifacts/CleanMyMac-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
