name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: DiskKit tests (Linux) + translations
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test --package-path Packages/DiskKit
      - name: Check translations
        run: |
          apt-get update -qq && apt-get install -y -qq python3 >/dev/null
          python3 scripts/check_localization.py

  macos:
    name: Build macOS app + DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build (tests + universal app + DMG)
        run: scripts/build.sh
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: CleanMyMac-dmg
          path: build/*.dmg
          if-no-files-found: error
